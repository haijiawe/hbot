[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/hbot"

[workspace.dependencies]
# 内部 crate：统一在这里写一次 path + version，子 crate 用 { workspace = true }。
hbot-core = { path = "crates/hbot-core", version = "0.1.0" }
hbot-store = { path = "crates/hbot-store", version = "0.1.0" }
hbot-code = { path = "crates/hbot-code", version = "0.1.0" }
hbot-bot = { path = "crates/hbot-bot", version = "0.1.0" }
hbot-agent = { path = "crates/hbot-agent", version = "0.1.0" }
hbot-workspace = { path = "crates/hbot-workspace", version = "0.1.0" }
hbot-adapters = { path = "crates/hbot-adapters", version = "0.1.0" }
hbot-command = { path = "crates/hbot-command", version = "0.1.0" }
hbot-rpc = { path = "crates/hbot-rpc", version = "0.1.0" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 只用于"人手编辑的配置文件"（`bots.json` / `agent.json`）：字段名打错要能**告警**，
# 而不是静默失效、也不是硬失败。机器生成的 `hbot.json` 不走这条路（那边用
# `deny_unknown_fields` 直接拒）。
serde_ignored = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util"] }
# `rustls-tls-webpki-roots`：让 OneBot 的 `wss://` 走 rustls + 公共根证书，
# 与 `reqwest` 的 `rustls-tls` 共用同一套 TLS 栈（不引入 openssl / native-tls）。
# 注意：这个 feature 只带"连接器"，**不选加密后端** —— 后端由使用方的
# `rustls` 依赖选（本 workspace 只开 `ring`，见 `crates/hbot-adapters/Cargo.toml`）。
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ignore = "0.4"
grep-searcher = "0.1"
grep-matcher = "0.1"
grep-regex = "0.1"
blake3 = "1"
memchr = "2"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-trait = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
debug = 1
