[package]
name = "hbot-redteam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 红队用例集：只有测试与夹具，不发布、不参与任何运行时依赖图。
publish = false

# 本 crate 没有 [dependencies]：所有实现 crate 一律只在 dev-dependencies 里，
# 这样它永远不会被别的 crate 依赖到（`cargo tree -i hbot-redteam` 只有 test 目标）。
[dev-dependencies]
hbot-core = { workspace = true }
hbot-workspace = { workspace = true }
hbot-command = { workspace = true }
hbot-agent = { workspace = true }
hbot-code = { workspace = true }
hbot-bot = { workspace = true }
hbot-store = { workspace = true }
hbot-rpc = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }