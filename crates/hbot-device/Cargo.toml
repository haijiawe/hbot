[package]
name = "hbot-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 内部实现 crate，不发布（只给 hbot-rpc 的组合根用）。
publish = false

[dependencies]
# 只依赖 hbot-core（方向是 rpc → device → core），见 docs/09-device-capability.md §5。
# 契约（`DeviceBackend` / `DeviceError`）全在 hbot-core::device，这里一个类型都不新造。
hbot-core = { workspace = true }
tracing = { workspace = true }

# Win32 只在本平台进依赖图。版本与 crates/hbot-command 保持一致（0.59），
# 免得同一个 workspace 里为同一个 crate 选两份 windows-sys。
[target.'cfg(windows)'.dependencies]
# 只开用到的 feature，逐个有理由：
# - Foundation：HWND/HDC/HANDLE 与 GetLastError/CloseHandle；
# - Graphics_Gdi：BitBlt + CreateDIBSection（截图的像素来源）；
# - Storage_Xps：`PrintWindow` 在 windows-sys 里声明在这个模块（不是 GDI）；
# - System_DataExchange / System_Ole：剪贴板 + `CF_UNICODETEXT`；
# - System_Memory：`GlobalAlloc/GlobalLock/GlobalUnlock`（CF_UNICODETEXT 的内存）；
# - System_StationsAndDesktops：`OpenInputDesktop`（锁屏/安全桌面检测）；
# - System_Threading：`OpenProcess` + `QueryFullProcessImageNameW`（进程映像名）；
# - UI_Input_KeyboardAndMouse：`SendInput` 与 `INPUT`/虚拟键码；
# - UI_WindowsAndMessaging：`EnumWindows`/`GetForegroundWindow`/窗口样式。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    # System_Com：`CoInitializeEx` + `CoIncrementMTAUsage`。WinRT 的对象要求线程先进公寓
    # （`Windows.Media.Ocr` 的 `RecognizeAsync` 走这条路），Windows 上这就是 COM 公寓；
    # 刻意不引 `CoUninitialize` —— 见 src/windows.rs 的 `hold_mta_for_process`（拆公寓会让
    # `windows` crate 的进程级激活工厂缓存悬空，实测直接 0xC0000005）。
    "Win32_System_Com",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# OCR 走 WinRT 的 `Windows.Media.Ocr`，必须用 `windows`（带类型投影）而不是 `windows-sys`
# （只有裸 ABI 声明，没有 `OcrEngine`/`SoftwareBitmap` 这些类）。只开用到的 feature：
# - Foundation：`OcrResult` 的 `BoundingRect`/`TextAngle` 用的是 `Foundation::Rect` /
#   `Foundation::IReference<f64>`（`windows` 的投影按命名空间拆 feature，用不到不等于不用开）；
# - Graphics_Imaging：`SoftwareBitmap` + `BitmapPixelFormat`/`BitmapAlphaMode`（OCR 的输入）；
# - Media_Ocr：`OcrEngine` / `OcrResult` 本体；
# - Storage_Streams：`DataWriter` 用来把 BGRA 字节变成 `SoftwareBitmap` 需要的 `IBuffer`
#   （`CreateCopyWithAlphaFromBuffer` 的入参是 `IBuffer`，没有 `&[u8]` 的重载）。
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
]
