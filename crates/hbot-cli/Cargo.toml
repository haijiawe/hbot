[package]
name = "hbot-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hbot"
path = "src/main.rs"

[dependencies]
hbot-core = { path = "../hbot-core" }
hbot-rpc = { path = "../hbot-rpc" }
hbot-adapters = { path = "../hbot-adapters" }
hbot-code = { path = "../hbot-code" }
# 回放本体（读历史入站/出站、编译、逐条 dispatch、比对）都在 hbot-replay，与 IDE 的
# `replay_run` 共用同一份实现；本 crate 只留 CLI 侧的开库、打印与退出码。
hbot-replay = { path = "../hbot-replay" }
# `replay` 的事件 JSON 与生产共用 `hbot-bot::event_json`。
hbot-bot = { path = "../hbot-bot" }
# `replay` 要读项目库里的历史入站/出站（只加只读查询，见 hbot-store/src/db.rs）。
hbot-store = { path = "../hbot-store" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
# `sync` 给事件桥用（`EventBus::subscribe` 是 `broadcast::Receiver`）：
# 少了它 `tokio::sync::broadcast` 这条路径编译不过。
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true