[package]
name = "hbot-parity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# 只含跨 crate 的集成回归测试：没有 src/lib.rs，全部用例在 tests/ 下。
# 为什么单开一个 crate 见 docs/04-implementation-plan.md §4.1：接缝测试塞进
# 任何一个实现 crate 的 tests/ 都会逼那个 crate 反向依赖别人。
publish = false

[dev-dependencies]
hbot-core = { path = "../hbot-core" }
hbot-store = { path = "../hbot-store" }
hbot-code = { path = "../hbot-code" }
hbot-bot = { path = "../hbot-bot" }
hbot-agent = { path = "../hbot-agent" }
hbot-workspace = { path = "../hbot-workspace" }
hbot-adapters = { path = "../hbot-adapters" }
hbot-rpc = { path = "../hbot-rpc" }
async-trait.workspace = true
serde_json.workspace = true
# `net`：`tests/support/gateway.rs` 要自己 bind 一个 `TcpListener`（workspace 的
# features 列表里没有它），这里只在 dev 侧并上一项，不动根 `Cargo.toml`。
tokio = { workspace = true, features = ["net"] }
uuid.workspace = true
# 手搓 OneBot 11 网关的服务端半边 + 用例里的原生 WS 客户端。`futures-util` 的
# `sink` 由 tokio-tungstenite 已经启用，这里显式写出来，不依赖特性合并的顺序。
tokio-tungstenite.workspace = true
futures-util = { workspace = true, features = ["sink"] }
